# CPZ terminal configuration for kmscon.
#
# kmscon owns DRM/KMS directly; there is no compositor. The UI is a tmux
# session with a one-row status bar at the top. multi-monitor=scaled keeps the
# same columns/rows on the internal panel and HDMI, scaling the font up on the
# larger display.

drm
no-hwaccel
gpus=all
multi-monitor=scaled

# Terminus 6x12 gives the 53x14 grid on the 320x170 panel. If fontconfig cannot
# provide Nerd Font fallback glyphs, switch font-engine to pango.
font-engine=freetype
font-size=12
font-name=Terminus

xkb-layout=us
xkb-repeat-delay=200
xkb-repeat-rate=65

no-mouse
no-session-control
session-max=1
no-issue
no-bell
sb-size=1000
dpms-timeout=30

term=kmscon

palette=custom
palette-black=31,36,48
palette-red=224,90,79
palette-green=123,201,111
palette-yellow=224,179,65
palette-blue=122,162,247
palette-magenta=199,146,234
palette-cyan=86,182,194
palette-light-grey=216,222,233
palette-dark-grey=75,82,99
palette-light-red=255,122,107
palette-light-green=155,224,138
palette-light-yellow=242,204,96
palette-light-blue=154,184,255
palette-light-magenta=215,166,255
palette-light-cyan=127,214,223
palette-white=245,247,250
palette-foreground=216,222,233
palette-background=11,15,20
