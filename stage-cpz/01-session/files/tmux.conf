# CPZ session layout for the kmscon terminal.
#
# The top row is the status bar. cpz-bar --tmux-watch will take over
# status-left/status-right once the CPZ daemon and bar are installed; this
# baseline keeps the layout testable before that.

set -g default-terminal "tmux-256color"
set -ag terminal-features "kmscon:RGB"

set -g status on
set -g status-position top
set -g status-interval 1
set -g status-style "bg=#0b0f14,fg=#d8dee9"
set -g status-left " #[bold][#S] "
set -g status-right " #[bold]%H:%M "
set -g status-left-length 30
set -g status-right-length 30
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[reverse] #I:#W #[default] "

set -g history-limit 2000
set -g buffer-limit 20
set -g mouse off
set -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
set -g escape-time 0
set -g set-clipboard off

# Compact page switching. The full CPZ bar will add Alt+0/T/W/N later.
bind -n M-Tab next-window
bind -n M-BTab previous-window
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
