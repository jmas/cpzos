# CardputerZero: the display is only a few rows high, so keep Midnight
# Commander's chrome out of the way and give the rows to the file panels.
#
# mc uses this file as the profile for a user who has no ~/.config/mc/ini yet
# and copies the values there when the user quits. F9 still opens the menu
# when the menu bar is hidden; the command prompt and the per-panel
# mini-status stay, because they show the current directory and file.
[Layout]
menubar_visible=false
keybar_visible=false
message_visible=false
