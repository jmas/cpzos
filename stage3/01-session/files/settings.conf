# CPZ system defaults. cpz-settings writes user overrides to
# ~/.config/cpz/settings.conf, which takes precedence over this file.
#
# theme          cpz-tokyo-night | cpz-catppuccin-mocha | cpz-gruvbox-dark |
#                cpz-nord | cpz-kanagawa | cpz-github-light | cpz-mono |
#                cpz-light-high-contrast
# show_clock     1 | 0
# clock_24h      1 (24-hour) | 0 (12-hour)
# show_date      1 | 0
# date_format    short (MM-DD) | iso (YYYY-MM-DD) | eu (DD.MM.YYYY) | us (MM/DD/YYYY)
# show_battery   1 | 0
# show_volume    1 | 0 (V0-V4 level, VM when muted)
# show_brightness 1 | 0 (B0-B10 panel brightness, off by default)
# show_conn      1 | 0 (master switch for the E/W/B indicators)
# show_eth       1 | 0 (Ethernet indicator, off by default)
# show_wifi      1 | 0 (Wi-Fi indicator)
# show_bt        1 | 0 (Bluetooth indicator)
#   Indicators are hidden while their interface is OFF: for example, B is not
#   shown when Bluetooth is powered off, and W is not shown when the Wi-Fi
#   radio is disabled. A radio that is on but has nothing connected still
#   shows the plain W/B token.
# display        auto | panel | hdmi
#   auto: follow HDMI hotplug; the internal panel is switched off (blank +
#         backlight off) while HDMI is active
#   panel / hdmi: force one output; the other output is blanked
# brightness     10-100 (percent)
# font_panel     console font for the internal CPZ panel: 6x12 (53x14 cells)
#                or 8x16 (40x10 cells). Cell size is width x height in pixels.
# font_hdmi      console font for HDMI: auto, or one of the cell sizes 32x64,
#                28x56, 24x48, 20x40, 16x32, 14x28, 12x24, 11x22, 10x20,
#                10x18, 6x12. auto keeps about 25 rows and scales a Terminus
#                base font when the packaged sizes are too small for the mode;
#                an explicit entry pins that cell size.
# screen_timeout 0 | 5 | 10 | 30 (minutes, 0 = never)
#                blanks the console only; the HDMI link is not powered down
# mouse          1 | 0 (wheel scrolling and mouse selection in tmux)
# history_limit  scrollback lines for new panes
# mode_keys      vi | emacs (tmux copy mode)
# status_interval 1 | 2 | 5 seconds (tmux status refresh)
# set_clipboard  1 | 0 (OSC52)
# automatic_rename 1 | 0
# keyboard_layout auto | cpz | standard
#   auto: standard for an external USB/Bluetooth/PS2 keyboard, CPZ otherwise
#   cpz: always use the CardputerZero internal keymap
#   standard: always use the configured standard layout
# keyboard_layouts  comma-separated console layouts to enable and cycle.
#                   Any XKB layout code works (see
#                   `localectl list-x11-keymap-layouts`); e.g. us,gb,ua,ru,de,...
# keyboard_layout_active  layout currently selected (Alt+Space cycles)
# show_layout    1 | 0 (current language layout in the status bar)
keyboard_layout=auto
keyboard_layouts=us
keyboard_layout_active=us
theme=cpz-tokyo-night
show_clock=1
clock_24h=1
show_date=0
date_format=short
show_battery=1
show_volume=0
show_brightness=0
show_conn=1
show_eth=0
show_wifi=1
show_bt=1
show_layout=1
display=auto
font_panel=6x12
font_hdmi=auto
brightness=100
screen_timeout=0
mouse=0
history_limit=2000
mode_keys=vi
status_interval=5
set_clipboard=0
automatic_rename=1
