# CPZ system defaults. cpz-settings writes user overrides to
# ~/.config/cpz/settings.conf, which takes precedence over this file.
#
# language      en | uk | pl | de | fr | es | it | pt | tr | ja | zh
# theme          cpz-campbell | cpz-homebrew | cpz-ocean | cpz-red-sands |
#                cpz-terminal-basic | cpz-man-page | cpz-novel |
#                cpz-papercolor-light | cpz-mono | cpz-light-high-contrast
# show_clock     1 | 0
# clock_24h      1 (24-hour) | 0 (12-hour)
# show_date      1 | 0
# date_format    short (MM-DD) | iso (YYYY-MM-DD) | eu (DD.MM.YYYY) | us (MM/DD/YYYY)
# show_battery   1 | 0
# show_volume    1 | 0 (V0-V4 level, VM when muted)
# show_brightness 1 | 0 (B0-B10 panel brightness, off by default)
# show_conn      1 | 0 (network indicators: Wi/Bt while enabled, + when
#                connected; Et+ only while an Ethernet cable is connected)
#   Indicators are hidden while their interface is OFF: for example, B is not
#   shown when Bluetooth is powered off, and W is not shown when the Wi-Fi
#   radio is disabled. A radio that is on but has nothing connected still
#   shows the plain W/B token.
# display        auto | panel | hdmi
#   auto: follow HDMI hotplug; the internal panel backlight is switched off
#         while HDMI is the active output
#   panel: use only the panel; HDMI is not driven
#   hdmi: HDMI while a monitor is attached, panel otherwise
# brightness     10-100 (percent)
# font_family    terminus | dejavu | liberation | noto | hack | fira | jetbrains
#                typeface used by the whole terminal interface (foot, and
#                through it tmux, Settings and every app inside the tab).
#                Settings > Display > Font applies it immediately by replacing
#                just the terminal; the recovery consoles on tty2/tty3 keep
#                their bitmap console font.
# font_size_panel / font_size_hdmi
#                foot/Terminus font size in pixels (12-32) for the internal
#                panel and for HDMI. Each output remembers its own size; the
#                Alt+G / Alt+M shortcut (rebindable in Settings > Input >
#                Shortcuts) and Settings > Display > Text Size change the size
#                of the active output. The value takes effect immediately by
#                replacing just the terminal.
# screen_timeout 0 | 5 | 10 | 30 (minutes, 0 = never). The cage session does
#                not yet have a compositor-side DPMS timer; the value is kept
#                for the idle helper.
# mouse          1 | 0 (Settings > Input > Mouse Support; tmux wheel/selection
#                and the cage cursor for a connected USB/Bluetooth mouse)
# mouse_speed    -10..10 (libinput Accel Speed divided by ten; 0.0 is the
#                default, +10 is fastest and -10 is slowest)
# history_limit  scrollback lines for new panes
# mode_keys      vi | emacs (tmux copy mode)
# status_interval 1 | 2 | 5 seconds (tmux status refresh)
# set_clipboard  1 | 0 (copy tmux selections to the system clipboard over OSC52)
# automatic_rename 1 | 0
# keyboard_layout auto | cpz | standard
#   auto: standard for an external USB/Bluetooth/PS2 keyboard, CPZ otherwise
#   cpz: always use the CardputerZero internal keymap
#   standard: always use the configured standard layout
# keyboard_layouts  comma-separated console layouts to enable and cycle.
#                   Any XKB layout code works (see
#                   `localectl list-x11-keymap-layouts`); e.g. us,gb,ua,ru,de,...
# keyboard_layout_active  layout currently selected. Alt+Space cycles it by
#                   default (rebindable in Settings > Input > Shortcuts)
#                   and updates the XKB layout used by cage.
# show_layout    1 | 0 (current language layout in the status bar; shown only
#                 when two or more layouts are enabled)
keyboard_layout=auto
keyboard_layouts=us
keyboard_layout_active=us
language=en
theme=cpz-campbell
show_clock=1
clock_24h=1
show_date=0
date_format=short
show_battery=1
show_volume=0
show_brightness=0
show_conn=1
show_layout=1
display=auto
font_family=terminus
font_size_panel=12
font_size_hdmi=16
brightness=100
screen_timeout=0
mouse=1
mouse_speed=0
history_limit=2000
mode_keys=vi
status_interval=5
set_clipboard=1
automatic_rename=1
