# CardputerZero Midnight Commander skin.
#
# foot applies the palette from /etc/cpz/themes/<theme>.palette, and every CPZ
# palette keeps ANSI slot 0 as the theme background and slot 7 as its
# foreground. This skin therefore references palette slots instead of absolute
# colours: one skin follows every theme, light or dark, and changing the theme
# recolours a running mc as soon as foot reloads the palette.
#
# Rules for future edits:
#   - draw ordinary content as <accent>;black, i.e. on the theme background;
#   - draw selected or raised surfaces as black;lightgray, and their selected
#     item back as lightgray;black, so every pair is slot 0 against slot 7;
#   - do not put an accent on a lightgray background. Slots 1-15 are chosen for
#     at least 4.5:1 contrast on slot 0 in every shipped palette, but there is
#     no accent that is safe on slot 7 in all of them (Ocean in particular);
#   - draw panel and viewer frames as blue;black, so they read as outlines
#     instead of blending into the file names (the `frame` role exists in
#     mc >= 4.8.34; older versions use the section default for frames).
# tests/test_cpz_mc_skin.py enforces these rules against every palette.
#
# The [Lines] section is required, not decorative. mc up to 4.8.33 (the version
# in Debian trixie) reads frame characters from a group spelled "Lines" and
# defaults every missing key to a space, so a skin without it draws panels and
# dialogs with invisible borders. mc 4.8.34+ accepts "lines" as well but still
# falls back to visible box characters for missing keys; the capitalised name
# keeps one skin working on both. Keep every value a single non-space
# character: tests/test_cpz_mc_skin.py rejects blank or multi-cell frames.

[skin]
    description = CardputerZero (follows the theme palette)

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[core]
    _default_ = lightgray;black
    selected = black;lightgray
    marked = yellow;black
    markselect = black;yellow
    gauge = black;lightgray
    input = black;lightgray
    inputunchanged = gray;black
    inputmark = lightgray;black
    disabled = gray;black
    reverse = black;lightgray
    commandlinemark = black;lightgray
    header = yellow;black
    inputhistory =
    commandhistory =
    shadow = gray;black
    frame = blue;black

[dialog]
    _default_ = black;lightgray
    dfocus = lightgray;black
    dhotnormal = black;lightgray;bold
    dhotfocus = lightgray;black;bold
    dselnormal = lightgray;black
    dselfocus = lightgray;black;bold
    dtitle = black;lightgray;bold
    dframe = black;lightgray

[error]
    _default_ = black;red
    errdfocus = lightgray;black
    errdhotnormal = black;red;bold
    errdhotfocus = lightgray;black;bold
    errdtitle = black;red;bold
    errdframe = black;red

[filehighlight]
    directory = blue;
    executable = green;
    symlink = cyan;
    hardlink =
    stalelink = brightred;
    device = brightmagenta;
    special = cyan;
    core = red;
    temp = gray;
    archive = brightmagenta;
    doc = brown;
    source = cyan;
    media = green;
    graph = brightcyan;
    database = brightred;

[menu]
    _default_ = black;lightgray
    menusel = lightgray;black
    menuhot = black;lightgray;bold
    menuhotsel = lightgray;black;bold
    menuinactive = gray;black
    menuframe = black;lightgray

[popupmenu]
    _default_ = black;lightgray
    menusel = lightgray;black
    menutitle = black;lightgray;bold
    menuframe = black;lightgray

[buttonbar]
    hotkey = yellow;black;bold
    button = black;lightgray

[statusbar]
    _default_ = black;lightgray

[help]
    _default_ = black;lightgray
    helpitalic = black;lightgray;underline
    helpbold = black;lightgray;bold
    helplink = lightgray;black
    helpslink = lightgray;black;bold
    helptitle = black;lightgray;bold
    helpframe = black;lightgray

[editor]
    _default_ = lightgray;black
    editbold = yellow;black;bold
    editmarked = black;lightgray
    editwhitespace = gray;black
    editnonprintable = gray;black
    editlinestate = black;lightgray
    bookmark = black;red
    bookmarkfound = black;green
    editrightmargin = gray;black
    editframe = gray;black
    editframeactive = yellow;black
    editframedrag = lightgray;black

[viewer]
    _default_ = lightgray;black
    viewbold = yellow;black;bold
    viewunderline = brightred;black
    viewboldunderline = yellow;black;bold
    viewselected = black;lightgray
    viewframe = blue;black

[diffviewer]
    added = black;green
    changedline = black;cyan
    changednew = black;red
    changed = black;lightgray
    removed = black;red
    error = lightgray;black;bold
