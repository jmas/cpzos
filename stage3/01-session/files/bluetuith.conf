# CPZ bluetuith configuration.
#
# bluetuith only looks for its config below XDG_CONFIG_HOME, ~/.config or
# ~/.bluetuith, so the image installs this file into the first user's home.
# bluetuith accepts HJSON, hence the unquoted keys.
#
# The internal panel is 320x170, about 53x14 cells. Hiding the two-line help
# footer leaves the whole screen to the device list and removes the underlined
# group labels that made the TUI look unlike wifitui. The keys are documented
# in README.md and shown by ? on demand.
{
  no-warning: true
  no-help-display: true

  keybindings: {
    # The upstream default is Q (Shift+Q). q is what wifitui uses and what a
    # user reaches for first.
    Quit: q
    Help: ?
  }

  # Palette names, not hex values, so the manager follows the active CPZ
  # terminal theme the same way wifitui-theme.toml does.
  theme: {
    Text: white
    Border: grey
    # "transparent" is the config spelling for the terminal default colour;
    # bluetuith rejects the literal value "default" in a user theme.
    Background: transparent
    StatusInfo: white
    StatusError: red
    Adapter: white
    AdapterPowered: green
    AdapterNotPowered: red
    AdapterDiscoverable: aqua
    AdapterScanning: yellow
    AdapterPairable: mediumorchid
    Device: white
    DeviceType: grey
    DeviceAlias: white
    DeviceConnected: green
    DeviceDiscovered: white
    DeviceProperty: grey
    DevicePropertyConnected: green
    DevicePropertyDiscovered: orange
    Menu: white
    MenuBar: transparent
    MenuItem: white
    ProgressBar: white
    ProgressText: white
  }
}
