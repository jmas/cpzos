# name: Ocean
# CPZ tmux theme: Ocean. macOS Terminal's white-on-blue classic, panel-tuned.
# alert=ff9a9a
# warn=e5e500
set -g status-style "bg=#1a3f9c,fg=#ffffff"
set -g window-style "bg=#224fbc,fg=#ffffff"
set -g window-active-style "bg=#224fbc,fg=#ffffff"
set -g status-left-style "fg=#e5e500,bold"
set -g status-right-style "fg=#ffffff"

set -g window-status-style "fg=#d1d1d1,bg=#224fbc"
set -g window-status-current-style "fg=#224fbc,bg=#e5e500,bold"
set -g window-status-activity-style "fg=#ffc2c2,bg=#224fbc,bold"

set -g pane-border-style "fg=#91aae4"
set -g pane-active-border-style "fg=#e5e500"
set -g message-style "fg=#ffffff,bg=#1a3f9c"
set -g message-command-style "fg=#ffffff,bg=#1a3f9c"
set -g mode-style "fg=#224fbc,bg=#e5e500"
set -g copy-mode-match-style "fg=#224fbc,bg=#ffc2c2"
