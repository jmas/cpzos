# name: PaperColor Light
# CPZ tmux theme: PaperColor Light. Grey paper with saturated terminal ink.
set -g status-style "bg=#e2e2e2,fg=#444444"
set -g window-style "bg=#eeeeee,fg=#444444"
set -g window-active-style "bg=#eeeeee,fg=#444444"
set -g status-left-style "fg=#005f87,bold"
set -g status-right-style "fg=#444444"

set -g window-status-style "fg=#686868,bg=#eeeeee"
set -g window-status-current-style "fg=#eeeeee,bg=#444444,bold"
set -g window-status-activity-style "fg=#af0000,bg=#eeeeee,bold"

set -g pane-border-style "fg=#cfcfcf"
set -g pane-active-border-style "fg=#005f87"
set -g message-style "fg=#444444,bg=#e2e2e2"
set -g message-command-style "fg=#444444,bg=#e2e2e2"
set -g mode-style "fg=#eeeeee,bg=#444444"
set -g copy-mode-match-style "fg=#eeeeee,bg=#af0000"
