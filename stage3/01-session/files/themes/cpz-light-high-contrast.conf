# name: Light High Contrast
# CPZ tmux theme: Light High Contrast. Maximum legibility in daylight.
set -g status-style "bg=#ffffff,fg=#000000"
set -g window-style "bg=#ffffff,fg=#000000"
set -g window-active-style "bg=#ffffff,fg=#000000"
set -g status-left-style "fg=#0f4a85,bold"
set -g status-right-style "fg=#000000"

set -g window-status-style "fg=#5a5a5a,bg=#ffffff"
set -g window-status-current-style "fg=#ffffff,bg=#0f4a85,bold"
set -g window-status-activity-style "fg=#6d6d00,bg=#ffffff,bold"

set -g pane-border-style "fg=#000000"
set -g pane-active-border-style "fg=#0f4a85"
set -g message-style "fg=#000000,bg=#f0f0f0"
set -g message-command-style "fg=#000000,bg=#f0f0f0"
set -g mode-style "fg=#ffffff,bg=#0f4a85"
set -g copy-mode-match-style "fg=#ffffff,bg=#6d6d00"
