# name: Gruvbox Dark
# CPZ tmux theme: Gruvbox Dark. Warm retro browns with high readability.
set -g status-style "bg=#1d2021,fg=#ebdbb2"
set -g window-style "bg=#1d2021,fg=#ebdbb2"
set -g window-active-style "bg=#1d2021,fg=#ebdbb2"
set -g status-left-style "fg=#4c9295,bold"
set -g status-right-style "fg=#ebdbb2"

set -g window-status-style "fg=#938576,bg=#1d2021"
set -g window-status-current-style "fg=#1d2021,bg=#4c9295,bold"
set -g window-status-activity-style "fg=#d79921,bg=#1d2021,bold"

set -g pane-border-style "fg=#524d47"
set -g pane-active-border-style "fg=#4c9295"
set -g message-style "fg=#ebdbb2,bg=#2e2e2d"
set -g message-command-style "fg=#ebdbb2,bg=#2e2e2d"
set -g mode-style "fg=#1d2021,bg=#4c9295"
set -g copy-mode-match-style "fg=#1d2021,bg=#e65751"
