# name: Campbell
# CPZ tmux theme: Campbell. Windows Terminal's charcoal default with vivid ANSI.
# alert=ff4b5c
# warn=c19c00
set -g status-style "bg=#1a1a1a,fg=#cccccc"
set -g window-style "bg=#0c0c0c,fg=#cccccc"
set -g window-active-style "bg=#0c0c0c,fg=#cccccc"
set -g status-left-style "fg=#4a86ff,bold"
set -g status-right-style "fg=#cccccc"

set -g window-status-style "fg=#7e7e7e,bg=#0c0c0c"
set -g window-status-current-style "fg=#0c0c0c,bg=#3b78ff,bold"
set -g window-status-activity-style "fg=#f9f1a5,bg=#0c0c0c,bold"

set -g pane-border-style "fg=#606060"
set -g pane-active-border-style "fg=#3b78ff"
set -g message-style "fg=#cccccc,bg=#1f1f1f"
set -g message-command-style "fg=#cccccc,bg=#1f1f1f"
set -g mode-style "fg=#0c0c0c,bg=#3b78ff"
set -g copy-mode-match-style "fg=#ffffff,bg=#c50f1f"
