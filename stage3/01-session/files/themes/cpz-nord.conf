# name: Nord
# CPZ tmux theme: Nord. Cool arctic blue-grey, calm and even.
set -g status-style "bg=#2e3440,fg=#d8dee9"
set -g window-style "bg=#2e3440,fg=#d8dee9"
set -g window-active-style "bg=#2e3440,fg=#d8dee9"
set -g status-left-style "fg=#81a1c1,bold"
set -g status-right-style "fg=#d8dee9"

set -g window-status-style "fg=#939db1,bg=#2e3440"
set -g window-status-current-style "fg=#2e3440,bg=#81a1c1,bold"
set -g window-status-activity-style "fg=#ebcb8b,bg=#2e3440,bold"

set -g pane-border-style "fg=#5b6373"
set -g pane-active-border-style "fg=#81a1c1"
set -g message-style "fg=#d8dee9,bg=#3c4350"
set -g message-command-style "fg=#d8dee9,bg=#3c4350"
set -g mode-style "fg=#2e3440,bg=#81a1c1"
set -g copy-mode-match-style "fg=#2e3440,bg=#cf8a90"
