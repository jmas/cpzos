# name: Tokyo Night
# CPZ tmux theme: Tokyo Night. Modern indigo night with vivid accents.
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g window-style "bg=#1a1b26,fg=#c0caf5"
set -g window-active-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left-style "fg=#7aa2f7,bold"
set -g status-right-style "fg=#c0caf5"

set -g window-status-style "fg=#7982ab,bg=#1a1b26"
set -g window-status-current-style "fg=#1a1b26,bg=#7aa2f7,bold"
set -g window-status-activity-style "fg=#e0af68,bg=#1a1b26,bold"

set -g pane-border-style "fg=#454962"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "fg=#c0caf5,bg=#272939"
set -g message-command-style "fg=#c0caf5,bg=#272939"
set -g mode-style "fg=#1a1b26,bg=#7aa2f7"
set -g copy-mode-match-style "fg=#1a1b26,bg=#f7768e"
