# name: Mono
# CPZ tmux theme: Mono. Neutral grayscale with maximum contrast.
set -g status-style "bg=#0d0d0d,fg=#f5f7fa"
set -g window-style "bg=#0d0d0d,fg=#f5f7fa"
set -g window-active-style "bg=#0d0d0d,fg=#f5f7fa"
set -g status-left-style "fg=#f5f7fa,bold"
set -g status-right-style "fg=#d8dee9"

set -g window-status-style "fg=#8a93a6,bg=#0d0d0d"
set -g window-status-current-style "fg=#0d0d0d,bg=#d8dee9,bold"
set -g window-status-activity-style "fg=#f5f7fa,bg=#0d0d0d,bold"

set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#d8dee9"
set -g message-style "fg=#f5f7fa,bg=#1a1a1a"
set -g message-command-style "fg=#f5f7fa,bg=#1a1a1a"
set -g mode-style "fg=#0d0d0d,bg=#d8dee9"
set -g copy-mode-match-style "fg=#0d0d0d,bg=#f5f7fa"
