# name: Catppuccin Mocha
# CPZ tmux theme: Catppuccin Mocha. Soft warm pastels on deep charcoal.
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g window-style "bg=#1e1e2e,fg=#cdd6f4"
set -g window-active-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-style "fg=#89b4fa,bold"
set -g status-right-style "fg=#cdd6f4"

set -g window-status-style "fg=#83869d,bg=#1e1e2e"
set -g window-status-current-style "fg=#1e1e2e,bg=#89b4fa,bold"
set -g window-status-activity-style "fg=#f9e2af,bg=#1e1e2e,bold"

set -g pane-border-style "fg=#4b4d60"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "fg=#cdd6f4,bg=#2c2d3e"
set -g message-command-style "fg=#cdd6f4,bg=#2c2d3e"
set -g mode-style "fg=#1e1e2e,bg=#89b4fa"
set -g copy-mode-match-style "fg=#1e1e2e,bg=#f38ba8"
