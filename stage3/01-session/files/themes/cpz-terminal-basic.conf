# name: Terminal Basic
# CPZ tmux theme: Terminal Basic. macOS Terminal's white page and classic ANSI.
set -g status-style "bg=#f0f0f0,fg=#000000"
set -g window-style "bg=#ffffff,fg=#000000"
set -g window-active-style "bg=#ffffff,fg=#000000"
set -g status-left-style "fg=#0000b2,bold"
set -g status-right-style "fg=#000000"

set -g window-status-style "fg=#727272,bg=#ffffff"
set -g window-status-current-style "fg=#ffffff,bg=#0000b2,bold"
set -g window-status-activity-style "fg=#990000,bg=#ffffff,bold"

set -g pane-border-style "fg=#cccccc"
set -g pane-active-border-style "fg=#0000b2"
set -g message-style "fg=#000000,bg=#f0f0f0"
set -g message-command-style "fg=#000000,bg=#f0f0f0"
set -g mode-style "fg=#ffffff,bg=#0000b2"
set -g copy-mode-match-style "fg=#000000,bg=#e5e500"
