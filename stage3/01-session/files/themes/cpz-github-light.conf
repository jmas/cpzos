# name: GitHub Light
# CPZ tmux theme: GitHub Light. Crisp paper-white theme for daylight.
set -g status-style "bg=#ffffff,fg=#24292f"
set -g window-style "bg=#ffffff,fg=#24292f"
set -g window-active-style "bg=#ffffff,fg=#24292f"
set -g status-left-style "fg=#0969da,bold"
set -g status-right-style "fg=#24292f"

set -g window-status-style "fg=#57606a,bg=#ffffff"
set -g window-status-current-style "fg=#ffffff,bg=#0969da,bold"
set -g window-status-activity-style "fg=#4d2d00,bg=#ffffff,bold"

set -g pane-border-style "fg=#b3b7bc"
set -g pane-active-border-style "fg=#0969da"
set -g message-style "fg=#24292f,bg=#e7e9ea"
set -g message-command-style "fg=#24292f,bg=#e7e9ea"
set -g mode-style "fg=#ffffff,bg=#0969da"
set -g copy-mode-match-style "fg=#ffffff,bg=#cf222e"
