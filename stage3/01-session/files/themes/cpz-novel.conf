# name: Novel
# CPZ tmux theme: Novel. macOS Terminal's sepia page, easy in bright light.
set -g status-style "bg=#d2cdb2,fg=#3b2322"
set -g window-style "bg=#dfdbc3,fg=#3b2322"
set -g window-active-style "bg=#dfdbc3,fg=#3b2322"
set -g status-left-style "fg=#0000cc,bold"
set -g status-right-style "fg=#3b2322"

set -g window-status-style "fg=#5d5d5d,bg=#dfdbc3"
set -g window-status-current-style "fg=#dfdbc3,bg=#3b2322,bold"
set -g window-status-activity-style "fg=#bd0000,bg=#dfdbc3,bold"

set -g pane-border-style "fg=#c4bea0"
set -g pane-active-border-style "fg=#3b2322"
set -g message-style "fg=#3b2322,bg=#d2cdb2"
set -g message-command-style "fg=#3b2322,bg=#d2cdb2"
set -g mode-style "fg=#dfdbc3,bg=#3b2322"
set -g copy-mode-match-style "fg=#dfdbc3,bg=#904a00"
