# name: Kanagawa
# CPZ tmux theme: Kanagawa. Muted ink-wash tones for low light.
set -g status-style "bg=#1f1f28,fg=#dcd7ba"
set -g window-style "bg=#1f1f28,fg=#dcd7ba"
set -g window-active-style "bg=#1f1f28,fg=#dcd7ba"
set -g status-left-style "fg=#7e9cd8,bold"
set -g status-right-style "fg=#dcd7ba"

set -g window-status-style "fg=#89887f,bg=#1f1f28"
set -g window-status-current-style "fg=#1f1f28,bg=#7e9cd8,bold"
set -g window-status-activity-style "fg=#c0a36e,bg=#1f1f28,bold"

set -g pane-border-style "fg=#4f4e4f"
set -g pane-active-border-style "fg=#7e9cd8"
set -g message-style "fg=#dcd7ba,bg=#2e2e34"
set -g message-command-style "fg=#dcd7ba,bg=#2e2e34"
set -g mode-style "fg=#1f1f28,bg=#7e9cd8"
set -g copy-mode-match-style "fg=#1f1f28,bg=#d0686b"
