# name: Homebrew
# CPZ tmux theme: Homebrew. macOS Terminal's neon green-on-black classic.
set -g status-style "bg=#001400,fg=#00ff00"
set -g window-style "bg=#000000,fg=#00ff00"
set -g window-active-style "bg=#000000,fg=#00ff00"
set -g status-left-style "fg=#00e5e5,bold"
set -g status-right-style "fg=#00ff00"

set -g window-status-style "fg=#787878,bg=#000000"
set -g window-status-current-style "fg=#000000,bg=#00d900,bold"
set -g window-status-activity-style "fg=#e5e500,bg=#000000,bold"

set -g pane-border-style "fg=#1f3a1f"
set -g pane-active-border-style "fg=#00a600"
set -g message-style "fg=#00ff00,bg=#002400"
set -g message-command-style "fg=#00ff00,bg=#002400"
set -g mode-style "fg=#000000,bg=#00d900"
set -g copy-mode-match-style "fg=#000000,bg=#e5e500"
