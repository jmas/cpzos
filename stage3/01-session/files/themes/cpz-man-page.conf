# name: Man Page
# CPZ tmux theme: Man Page. macOS Terminal's pale paper-yellow for daylight.
set -g status-style "bg=#f5e87a,fg=#000000"
set -g window-style "bg=#fef49c,fg=#000000"
set -g window-active-style "bg=#fef49c,fg=#000000"
set -g status-left-style "fg=#0000b2,bold"
set -g status-right-style "fg=#000000"

set -g window-status-style "fg=#6b6b6b,bg=#fef49c"
set -g window-status-current-style "fg=#fef49c,bg=#0000b2,bold"
set -g window-status-activity-style "fg=#cc0000,bg=#fef49c,bold"

set -g pane-border-style "fg=#ddd070"
set -g pane-active-border-style "fg=#0000b2"
set -g message-style "fg=#000000,bg=#f5e87a"
set -g message-command-style "fg=#000000,bg=#f5e87a"
set -g mode-style "fg=#fef49c,bg=#0000b2"
set -g copy-mode-match-style "fg=#000000,bg=#e5e500"
