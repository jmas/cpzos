# name: Red Sands
# CPZ tmux theme: Red Sands. macOS Terminal's desert red with sand text.
# alert=ff9775
# warn=e7b000
set -g status-style "bg=#621d17,fg=#d7c9a7"
set -g window-style "bg=#7a251e,fg=#d7c9a7"
set -g window-active-style "bg=#7a251e,fg=#d7c9a7"
set -g status-left-style "fg=#e7b000,bold"
set -g status-right-style "fg=#d7c9a7"

set -g window-status-style "fg=#b3b3b3,bg=#7a251e"
set -g window-status-current-style "fg=#7a251e,bg=#e7b000,bold"
set -g window-status-activity-style "fg=#ff9775,bg=#7a251e,bold"

set -g pane-border-style "fg=#b9827e"
set -g pane-active-border-style "fg=#e7b000"
set -g message-style "fg=#d7c9a7,bg=#621d17"
set -g message-command-style "fg=#d7c9a7,bg=#621d17"
set -g mode-style "fg=#7a251e,bg=#e7b000"
set -g copy-mode-match-style "fg=#7a251e,bg=#ff9775"
