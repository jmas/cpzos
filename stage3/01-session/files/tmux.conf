# CPZ session layout for the cage + foot terminal.
#
# The top row is the status bar. The tab list already shows the current tab
# and its number, so the left side stays empty. The right side shows connected
# networks, battery and clock, rendered by cpz-status so Settings can change
# them at runtime.
#
# Window 1 is the shell while a terminal tab exists. The last window is always
# Settings, backed by the cpz-settings TUI. Closing the last terminal tab is
# allowed; Settings stays last so a new tab can be opened from it. Themes live
# in /etc/cpz/themes and are selected from Settings.

set -g default-terminal "tmux-256color"

# --- status bar -----------------------------------------------------------

set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-left-length 0
set -g status-right-length 36
set -g status-left ""

# Optional volume/brightness, battery + clock (cpz-status reads
# /etc/cpz/settings.conf and the per-user override so the Settings app can
# change the content without reloading tmux).
set -g status-right "#(/usr/local/bin/cpz-status) "

set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "

# --- tabs -----------------------------------------------------------------

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
# Share one session; a foot replacement for a theme or font change keeps the
# same tmux tabs and panes, and a display switch (cage restart) reattaches to
# them as well. A keyboard layout change does not touch the session.
set -g window-size largest
set -g history-limit 2000
set -g buffer-limit 20
set -g set-clipboard on
# The outer terminal is foot. Tell tmux that it supports OSC 52 so a copy in
# tmux also updates the system clipboard (foot forwards it to Wayland).
set -as terminal-features 'foot:clipboard'
set -g escape-time 0
set -g mode-keys vi
set -g mouse on

# Every CPZ command is a direct two-key Alt+key binding; no prefix is needed
# for day-to-day use. The default C-b prefix is hard to chord on the
# CardputerZero keyboard, so C-a is kept only as an advanced fallback for tmux
# commands that are not in the CPZ shortcut registry.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# --- keys -----------------------------------------------------------------

# All user-facing bindings are generated by cpz-keys from its registry and the
# user's ~/.config/cpz/keys.conf. Do not add `bind -n` lines here: a shortcut
# must be rebindable from Settings > Input > Shortcuts, and cpz-help /
# cpz-search must show the same key. cpz-keys also unbinds old defaults and
# stale aliases before applying the current ones.
# The build generates the cache for the first user, so the boot path does not
# start Python. Regenerate it only when it is missing or when a keys.conf was
# edited by hand (Settings already calls `cpz-keys apply` itself). The
# condition is a shell test; the Python start stays off the normal boot path.
if-shell '[ ! -s ~/.cache/cpz/tmux-keys.conf ] || { [ -e ~/.config/cpz/keys.conf ] && [ ~/.config/cpz/keys.conf -nt ~/.cache/cpz/tmux-keys.conf ]; } || { [ -e /etc/cpz/keys.conf ] && [ /etc/cpz/keys.conf -nt ~/.cache/cpz/tmux-keys.conf ]; }' \
	'run-shell "/usr/local/bin/cpz-keys write >/dev/null"'
source-file ~/.cache/cpz/tmux-keys.conf

# Copy mode is a mode, not a global chord: Alt+C enters it (from the registry),
# then the single-key vi navigation and these two-key paging keys apply. Fn+L /
# Fn+M map to PPage/NPage on the internal keyboard, so they stay useful there;
# Ctrl+U / Ctrl+D are the alternative without the Fn layer.
bind -T copy-mode-vi C-u send-keys -X page-up
bind -T copy-mode-vi C-d send-keys -X page-down
bind -T copy-mode-vi PPage send-keys -X page-up
bind -T copy-mode-vi NPage send-keys -X page-down
bind -T copy-mode C-u send-keys -X page-up
bind -T copy-mode C-d send-keys -X page-down
bind -T copy-mode PPage send-keys -X page-up
bind -T copy-mode NPage send-keys -X page-down
# A mouse drag enters copy mode and copies the selection when the button is
# released; double-click selects a word. Both key tables are kept explicit so
# the behaviour does not depend on tmux's built-in defaults.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi DoubleClick1Pane send-keys -X select-word
bind -T copy-mode DoubleClick1Pane send-keys -X select-word

# A tab is a process, not a state to inspect. If its last process exits, close
# the pane immediately instead of leaving tmux's dead-pane banner or an
# "exited" message on screen. Settings remains as the last tab.
set -g remain-on-exit off
set-hook -g pane-died 'kill-pane -t "#{pane_id}"'

# --- session housekeeping -------------------------------------------------

# Key hint on the first attach of a login session. cpz-hint targets the client explicitly:
# a plain display-message from this hook has no client context and is lost or
# printed into the pane, where the top status bar covers it.
set-hook -g client-attached 'run-shell -b "/usr/local/bin/cpz-hint #{client_name} >/dev/null 2>&1 || true"'
set-hook -ag client-attached 'run-shell -b "/usr/local/bin/cpz-session-ensure main >/dev/null 2>&1 || true"'
# The factory-password reminder opens after the first frame, not before tmux
# attaches. One popup per boot; cpz-first-login still checks whether the
# password changed, so a device with a real password shows nothing.
set-hook -ag client-attached 'run-shell -b "/usr/local/bin/cpz-first-login-popup #{client_name} >/dev/null 2>&1 || true"'

# The Settings window must always exist and stay last; window 1 is the shell
# while any terminal tab remains. The hook runs in the background so a pane
# exit is not blocked by re-creating the windows.
# window-linked also puts Settings back at the end if a tab was created by a
# raw tmux command instead of cpz-tab-new.
set-hook -g window-unlinked 'run-shell -b "/usr/local/bin/cpz-session-ensure #{session_name} >/dev/null 2>&1 || true"'
set-hook -g window-linked 'run-shell -b "/usr/local/bin/cpz-session-ensure #{session_name} >/dev/null 2>&1 || true"'
set-hook -g session-created 'run-shell -b "/usr/local/bin/cpz-session-ensure #{session_name} >/dev/null 2>&1 || true"'

# Apply the selected theme plus the user's mouse/history settings.
run-shell -b '/usr/local/bin/cpz-apply-settings >/dev/null 2>&1 || true'

# Persist the tab layout for the next boot. Periodic saving in
# cpz-session-save.timer covers changes that do not emit a hook.
set-hook -g after-new-window 'run-shell -b "/usr/local/bin/cpz-session-save >/dev/null 2>&1 || true"'
set-hook -g after-kill-pane 'run-shell -b "/usr/local/bin/cpz-session-save >/dev/null 2>&1 || true"'
set-hook -g after-rename-window 'run-shell -b "/usr/local/bin/cpz-session-save >/dev/null 2>&1 || true"'
set-hook -g after-select-window 'run-shell -b "/usr/local/bin/cpz-session-save >/dev/null 2>&1 || true"'
set-hook -g pane-exited 'run-shell -b "/usr/local/bin/cpz-session-save >/dev/null 2>&1 || true"'
set-hook -g client-detached 'run-shell -b "/usr/local/bin/cpz-session-save >/dev/null 2>&1 || true"'
