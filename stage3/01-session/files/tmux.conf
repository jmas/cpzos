# CPZ session layout for the kmscon console.
#
# The top row is the status bar:
#   left  - "<current tab> / <total tabs>"
#   right - input layout, volume, battery and clock, rendered by cpz-status so
#           Settings can change them at runtime
#
# Window 1 is always the shell. The last window is always Settings, backed by
# the cpz-settings TUI. Themes live in /etc/cpz/themes and are selected from
# Settings.

set -g default-terminal "tmux-256color"

# --- status bar -----------------------------------------------------------

set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-left-length 10
set -g status-right-length 36

# Current tab / total tabs. cpz-tab-info counts every window, including the
# Settings window, and publishes the active window index as the current token.
set -g @cpz_tab_current "1"
set -g @cpz_tab_total "1"
set -g status-left " #[bold]#{@cpz_tab_current} / #{@cpz_tab_total} "

# Optional volume/brightness, battery + clock (cpz-status reads
# /etc/cpz/settings.conf and the per-user override so the Settings app can
# change the content without reloading tmux).
set -g status-right "#(/usr/local/bin/cpz-status) "

set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "

# --- tabs -----------------------------------------------------------------

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
# Share one session; cpz-kmscon-output restarts kmscon (panel/HDMI choice,
# font size, theme) and tmux reattaches to the same tabs and panes.
set -g window-size largest
set -g history-limit 2000
set -g buffer-limit 20
set -g set-clipboard off
set -g escape-time 0
set -g mode-keys vi
set -g mouse off

# Every command in the CPZ key reference is a direct two-key Alt+letter (or
# Alt+arrow) binding; no prefix is needed for day-to-day use. The default C-b
# prefix is hard to chord on the CardputerZero keyboard, so C-a is kept only
# as an advanced fallback for tmux commands that are not mapped below.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# --- keys -----------------------------------------------------------------

# Tabs. Alt+Left/Right is the primary binding on the CardputerZero keyboard.
bind -n M-Left previous-window
bind -n M-Right next-window
bind -n M-Tab next-window
bind -n M-BTab previous-window

bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# Tab management. All of these are direct two-key bindings: no tmux prefix.
bind -n M-r command-prompt -p 'Rename tab:' "rename-window -- '%%'"
bind -n M-l choose-tree -Zw
bind -n M-q detach-client

# New tabs are inserted before Settings so Settings stays last.
bind -n M-t run-shell -b '/usr/local/bin/cpz-tab-new #{session_name}'
bind c run-shell -b '/usr/local/bin/cpz-tab-new #{session_name}'

# Panes. Letters are used instead of the usual prefix + % / " / o / z / x / {
# / } combinations: those need punctuation layers on the internal keyboard and
# a third key press. Alt+V splits left/right (vertical), Alt+B below, Alt+N /
# Alt+P move between panes, Alt+Z zooms, Alt+X closes (with a prompt) and
# Alt+J / Alt+K swap the pane with the previous / next one.
bind -n M-v split-window -h
bind -n M-b split-window -v
bind -n M-n select-pane -t :.+
bind -n M-p select-pane -t :.-
bind -n M-z resize-pane -Z
bind -n M-x confirm-before -p 'Close pane? (y/n)' kill-pane
bind -n M-j swap-pane -U
bind -n M-k swap-pane -D

# Font size. The old kmscon grab-zoom keys changed the runtime size only, so
# any session restart reset it. cpz-font stores the size in the CPZ settings and
# cpz-kmscon-output applies it; Settings edits the same font_size value.
# Sym+T is plus and Sym+R is minus on the internal keyboard, hence the Alt and
# Ctrl bindings for both shifted and unshifted forms of those keys.
bind -n M-+ run-shell '/usr/local/bin/cpz-font up'
bind -n M-= run-shell '/usr/local/bin/cpz-font up'
bind -n C-+ run-shell '/usr/local/bin/cpz-font up'
bind -n C-= run-shell '/usr/local/bin/cpz-font up'
bind -n M-- run-shell '/usr/local/bin/cpz-font down'
bind -n C-- run-shell '/usr/local/bin/cpz-font down'

# Close the current tab after a confirmation on the browser-like Alt+W. The
# helper checks Settings and the last terminal tab first, so it reports "this
# tab stays open" instead of asking and then refusing.
bind -n M-w run-shell -b '/usr/local/bin/cpz-tab-close-key #{session_name}'
bind & run-shell -b '/usr/local/bin/cpz-tab-close-key #{session_name}'

# Settings is always the last tab. Help opens as a popup over the current tab.
bind -n M-s run-shell -b '/usr/local/bin/cpz-settings-open #{session_name}'
bind -n M-h display-popup -E -w 90% -h 90% -T "CPZ keys" '/usr/local/bin/cpz-help'

# Omnisearch: PATH commands, CPZ actions, Settings pages and files in one
# popup. fzf is already part of the terminal tooling; no daemon or index.
bind -n M-o display-popup -E -w 90% -h 90% -T "CPZ search" '/usr/local/bin/cpz-search'

# Scrollback. Prefix + [ works too, but "[" needs the Sym layer on the internal
# keyboard. These direct bindings avoid both the prefix and the bracket:
# Alt+Up/Down use the arrow keys (Fn+F / Fn+X); Alt+PageUp/PageDown work with
# an external keyboard. PageUp/PageDown (Fn+L / Fn+M) also page inside copy
# mode.
bind -n M-Up copy-mode -u
bind -n M-Down copy-mode
bind -n M-PPage copy-mode -u
bind -n M-NPage copy-mode
bind -n M-c copy-mode
bind -n M-y paste-buffer -p

# Keep the same keys scrolling while copy mode is active, so there is no need
# to remember the vi keys. M-Down at the bottom is a no-op.
bind -T copy-mode-vi M-Up send-keys -X page-up
bind -T copy-mode-vi M-Down send-keys -X page-down
bind -T copy-mode-vi PPage send-keys -X page-up
bind -T copy-mode-vi NPage send-keys -X page-down
bind -T copy-mode M-Up send-keys -X page-up
bind -T copy-mode M-Down send-keys -X page-down
bind -T copy-mode PPage send-keys -X page-up
bind -T copy-mode NPage send-keys -X page-down

# Cycle the console input layout (English, Ukrainian, ...). The helper updates
# keyboard_layout_active and asks cpz-keyboard-layout to push the layout to
# systemd-localed; kmscon swaps its keymap in place, so the session and the
# HDMI link are not restarted.
bind -n M-Space run-shell -b '/usr/local/bin/cpz-layout-next'
bind -n M-i run-shell -b '/usr/local/bin/cpz-layout-next'

# Recovery: toggle between auto (HDMI when connected) and the CPZ panel. Useful
# when a monitor keeps HPD asserted while powered off, so auto still selects
# HDMI and the panel stays dark.
bind -n M-d run-shell -b '/usr/local/bin/cpz-display-toggle'

# --- session housekeeping -------------------------------------------------

# Key hint on every attach. cpz-hint targets the attached client explicitly:
# a plain display-message from this hook has no client context and is lost or
# printed into the pane, where the top status bar covers it.
set-hook -g client-attached 'run-shell -b "/usr/local/bin/cpz-hint #{client_name}"'

# Window 1 and the Settings window must always exist. The hook runs in the
# background so a pane exit is not blocked by re-creating the windows.
# window-linked also puts Settings back at the end if a tab was created by a
# raw tmux command instead of cpz-tab-new.
set-hook -g window-unlinked 'run-shell -b "/usr/local/bin/cpz-session-ensure #{session_name}"'
set-hook -g window-linked 'run-shell -b "/usr/local/bin/cpz-session-ensure #{session_name}"'
set-hook -g session-created 'run-shell -b "/usr/local/bin/cpz-session-ensure #{session_name}"'

# Apply the selected theme plus the user's mouse/history settings.
run-shell -b '/usr/local/bin/cpz-apply-settings'

# Persist the tab layout for the next boot. Periodic saving in
# cpz-session-save.timer covers changes that do not emit a hook.
set-hook -g after-new-window 'run-shell -b "/usr/local/bin/cpz-session-save"'
set-hook -g after-kill-pane 'run-shell -b "/usr/local/bin/cpz-session-save"'
set-hook -g after-rename-window 'run-shell -b "/usr/local/bin/cpz-session-save"'
set-hook -g after-select-window 'run-shell -b "/usr/local/bin/cpz-session-save"'
set-hook -ga after-select-window 'run-shell -b "/usr/local/bin/cpz-tab-info #{session_name}"'
set-hook -g pane-exited 'run-shell -b "/usr/local/bin/cpz-session-save"'
set-hook -g client-detached 'run-shell -b "/usr/local/bin/cpz-session-save"'
