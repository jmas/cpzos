# CPZ video player defaults.
#
# cage is pixman-only: a GPU video output allocates a dmabuf the compositor
# cannot import, and the window stays black. wlshm renders in software into
# wl_shm, which is exactly the path cage scans out.
vo=wlshm
hwdec=no

# Launched from mc/lf, the player should not take over the tmux pane or keep
# state between files. Keys and the OSD still work in the Wayland window.
terminal=no
save-position-on-quit=no

# The CM0 decodes in software; keep the scaler cheap.
scale=bilinear

# Subtitles next to the film: "Movie.srt", "Movie.en.srt", "Movie.2020.srt"
# and a Subs/ or subtitles/ folder all load without asking. Fuzzy matching is
# what catches the language/edition suffixes; exact alone needs the same stem.
sub-auto=fuzzy
sub-file-paths=.:Subs:subs:Subtitles:subtitles:Sub

# Prefer Ukrainian, then English; the first track is selected automatically.
slang=uk,en
