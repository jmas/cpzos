[Unit]
# The tty1 getty owns the login session that cage runs in. The autologin
# wrapper resolves uid 1000 at boot, and the profile script replaces the shell
# with cpz-cage. Do not start a second compositor service.
After=rpi-preseed.service cpz-tmux.service
Wants=rpi-preseed.service cpz-tmux.service
# There is no console fallback on the internal panel (fbcon is off and the
# panel has no fbdev node), so a permanently failed unit means a black screen
# until the next boot. Keep retrying a transient DRM/seat failure instead of
# letting systemd's default start rate limit give up after five attempts.
StartLimitIntervalSec=0

[Service]
# getty@.service is Type=idle: systemd then delays the start until the job
# queue is empty. During a display switch the queue contains the output helper
# that just called `systemctl start`, so the delay is 5 s on every switch.
# agetty does not need the idle start.
Type=simple
StandardOutput=tty
ExecStart=
ExecStart=-/usr/local/bin/cpz-getty %I
# A helper that hiccups must not leave the device without a session: the panel
# has no text console, and a failed ExecStartPre makes systemd retry the unit
# with its own backoff instead of starting cage.
#
# Both checks have bounded waits and touch separate state, so run them
# concurrently instead of paying the sum of the gauge and DRM/EDID waits.
ExecStartPre=-+/usr/local/bin/cpz-getty-prepare
Restart=always
# A compositor crash must not turn into an HDMI link that re-acquires every
# three seconds (the monitor shows that as flicker). The first restart is
# still immediate; repeated failures back off to a minute.
RestartSec=3
RestartSteps=5
RestartMaxDelaySec=60
