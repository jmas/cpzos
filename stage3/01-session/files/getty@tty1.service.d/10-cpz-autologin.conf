[Unit]
# Resolve uid 1000 after rpi-preseed has applied its optional user rename.
After=rpi-preseed.service
Wants=rpi-preseed.service

[Service]
# Replace the stock agetty command with the CPZ autologin wrapper. The wrapper
# falls back to a password prompt if uid 1000 does not exist.
ExecStart=
ExecStart=/usr/local/bin/cpz-getty %I $TERM
