[Unit]
# rpi-preseed may rename uid 1000 on first boot. Start kmscon after it has
# applied the preseed so cpz-login resolves the final account.
# cardputerzero-keymap/cpz-keyboard-layout publish the initial XKB layout to
# systemd-localed; kmscon reads it at startup and then follows locale1 changes.
After=rpi-preseed.service systemd-modules-load.service
After=cardputerzero-keymap.service cpz-keyboard-layout.service
Wants=rpi-preseed.service systemd-modules-load.service

[Service]
ExecStart=
ExecStart=/usr/local/bin/cpz-kmscon %I
Restart=always
RestartSec=1
OOMScoreAdjust=-900

[Install]
# Start at boot even if getty.target is not pulled in (it normally is).
WantedBy=multi-user.target
