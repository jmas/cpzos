# CPZ battery guard policy.
#
# The BQ27220 fuel gauge reports the charge in /sys/class/power_supply. The
# pack is a single LiPo cell: near empty, its voltage collapses under the
# CPU/boot load and the board resets. These thresholds keep enough margin for
# a clean poweroff.
#
# Values are integers. Percentages are 1-100.

# Shut down cleanly when the charge falls to this level while discharging.
shutdown_level=10

# Show a "battery low" notice at this level.
warn_level=20

# At boot, below this level the session is not started and the device powers
# off unless the charger is connected. Keep it at or above shutdown_level.
boot_level=10

# Voltage floor in microvolts; 0 disables it. The gauge's hardware cutoff is
# 3.15 V, so 3.35 V leaves room to sync and power off before the board browns
# out. This also catches a fuel gauge that still reports a high percentage
# while the pack is collapsing.
shutdown_voltage_uv=3350000

# Seconds to wait for the charger (or for a transient voltage sag to recover)
# before the device powers off. Also used for the boot countdown.
shutdown_grace=20

# Gauge poll interval, in seconds.
poll_interval=10
