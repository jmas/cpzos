# CPZ terminal configuration for kmscon.
#
# This is the static half of the configuration. cpz-kmscon-config renders it
# into /run/cpz-kmscon/kmscon.conf and appends the settings that need a restart
# (font size, palette, screen timeout). kmscon reads those only at startup and
# has no runtime API, so the generated file is what cpz-kmscon-output restarts
# the unit with. The keyboard layout is handled separately by systemd-localed
# and changes at runtime without a restart.
#
# There is no compositor: kmscon owns DRM/KMS directly and the UI inside it is
# tmux. multi-monitor=largest draws on the largest screen and stops drawing on
# the others, which is how the CPZ session ends up on exactly one display.
# cpz-kmscon-config switches to clone mode when the panel is forced in
# Settings, so the panel is drawn even while HDMI is attached.

drm
no-hwaccel
gpus=all
# Set by cpz-kmscon-config (largest, or clone for display=panel).
multi-monitor=largest
# Do NOT use use-original-mode: with fbcon mapped off nothing enables the
# panel CRTC at boot, so the "original" mode is 0x0 and kmscon's first atomic
# commit fails. kmscon uses the connector's preferred mode instead.
no-use-original-mode

# Terminus OTB is packaged for FreeType. The generated file sets the size.
font-engine=freetype
font-name=Terminus

# Font size is handled by tmux (cpz-font) so the chosen size is persisted in
# the CPZ settings. Do not grab the zoom keys here: kmscon's runtime zoom is
# not observable, so a layout change or restart would lose the size. The
# generated font-size below is the source of truth.

# The keyboard layout is owned by systemd-localed. With no xkb-layout here,
# kmscon listens to locale1 and swaps the keymap in place when
# cpz-keyboard-layout changes the layout, without restarting the session.
xkb-repeat-delay=200
xkb-repeat-rate=65

no-mouse
no-session-control
session-max=1
no-issue
no-bell
sb-size=2000
# kmscon does not ship a terminfo entry for TERM=kmscon, and tmux refuses to
# attach to an unknown terminal. libtsm is xterm-compatible, so the standard
# xterm-256color entry from ncurses-base is the safe value.
term=xterm-256color

# Set by cpz-kmscon-config from /etc/cpz/settings.conf:
#   multi-monitor largest, or clone when display=panel
#   font-size     Font Size in pixels (10-64, shared by panel and HDMI)
#   dpms-timeout  Screen Timeout (0 = never)
#   palette*      the selected CPZ theme
# The keyboard layout is not in this file: systemd-localed provides it at
# runtime so changing it does not restart the session.
