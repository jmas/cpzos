# CPZ economy session: terminal-first, no prefix for daily actions.
set -g default-terminal "tmux-256color"
set -g status on
set -g status-position top
set -g status-interval 0
set -g status-justify left
set -g status-left ""
set -g status-left-length 0
set -g status-right ""
set -g status-right-length 60
set -g status-style "fg=#d8dee9,bg=#161b22"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "fg=#0e1116,bg=#4ea1ff"
set -g window-status-style "fg=#7a8599,bg=#161b22"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename off
set -g history-limit 4000
set -g buffer-limit 20
set -g set-clipboard on
set -g mouse on
set -g escape-time 0
set -g mode-keys vi
set -g exit-empty off
set -g remain-on-exit off
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Daily two-key actions. Help owns the full list.
bind -n M-Space select-window -t :Home
bind -n M-t new-window -n Home /usr/local/bin/cpz-launcher
bind -n M-w kill-window
bind -n M-h new-window -n Help /usr/local/bin/cpz-help
bind -n M-p new-window -n Settings /usr/local/bin/cpz-settings
bind -n M-Tab next-window
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
