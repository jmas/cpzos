name: Publish UI repository

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Repository channel"
        type: choice
        options: [stable, beta]
        default: stable
  push:
    tags: ["ui-v*"]

permissions:
  contents: write

concurrency:
  group: ui-repository
  cancel-in-progress: false

jobs:
  publish:
    name: Sign and publish the UI repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the builder image
        run: docker build --platform linux/arm64 -t cpz-arch-builder docker

      - name: Sign the repository and upload the release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ github.event.inputs.channel || (endsWith(github.ref_name, '-beta') && 'beta' || 'stable') }}
          GPG_PRIVATE_KEY: ${{ secrets.CPZ_UI_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.CPZ_UI_GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.CPZ_UI_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "out/ui/packages/$CHANNEL"
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/work" -w /work \
            -e CHANNEL -e OUT_DIR="build/ui-repo/$CHANNEL" \
            -e PKG_DIR="out/ui/packages/$CHANNEL" \
            -e GPG_PRIVATE_KEY -e GPG_PASSPHRASE -e GPG_KEY_ID \
            cpz-arch-builder ./tools/ui-repo.sh

          tag="ui-$CHANNEL"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "CPZ UI repository ($CHANNEL)" \
              --notes "Signed CPZ UI pacman repository ($CHANNEL channel)."
          fi
          gh release upload "$tag" "build/ui-repo/$CHANNEL"/* --clobber
