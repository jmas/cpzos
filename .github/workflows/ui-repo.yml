name: Publish UI repository

on:
  workflow_dispatch:
  push:
    tags: ["ui-v*"]

permissions:
  contents: write

concurrency:
  group: ui-repository
  cancel-in-progress: false

jobs:
  publish:
    name: Sign and publish the UI repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the builder image
        run: docker build --platform linux/arm64 -t cpz-arch-builder docker

      - name: Prepare the package input directories
        run: mkdir -p out/ui/packages/stable out/ui/packages/beta

      - name: Sign both repositories and upload the releases
        env:
          GH_TOKEN: ${{ github.token }}
          GPG_PRIVATE_KEY: ${{ secrets.CPZ_UI_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.CPZ_UI_GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.CPZ_UI_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          for ch in stable beta; do
            docker run --rm --platform linux/arm64 \
              -v "$PWD:/work" -w /work \
              -e CHANNEL="$ch" -e OUT_DIR="build/ui-repo/$ch" \
              -e PKG_DIR="out/ui/packages/$ch" \
              -e GPG_PRIVATE_KEY -e GPG_PASSPHRASE -e GPG_KEY_ID \
              cpz-arch-builder ./tools/ui-repo.sh

            tag="ui-$ch"
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" \
                --title "CPZ UI repository ($ch)" \
                --notes "Signed CPZ UI pacman repository ($ch channel)."
            fi
            gh release upload "$tag" "build/ui-repo/$ch"/* --clobber
          done
