name: Publish UI repository

on:
  workflow_dispatch:
  push:
    tags: ["ui-v*"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Sign and publish the UI repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout the UI branch
        uses: actions/checkout@v4

      - name: Checkout the site from master
        uses: actions/checkout@v4
        with:
          ref: master
          path: master

      - name: Build the builder image
        run: docker build --platform linux/arm64 -t cpz-arch-builder docker

      - name: Prepare the package input directories
        run: mkdir -p out/ui/packages/stable out/ui/packages/beta

      - name: Sign and build both repositories
        env:
          SITE_DIR: master/site
          GPG_PRIVATE_KEY: ${{ secrets.CPZ_UI_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.CPZ_UI_GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.CPZ_UI_GPG_KEY_ID }}
        run: |
          for ch in stable beta; do
            docker run --rm --platform linux/arm64 \
              -v "$PWD:/work" -w /work \
              -e CHANNEL="$ch" -e SITE_DIR -e PKG_DIR="out/ui/packages/$ch" \
              -e GPG_PRIVATE_KEY -e GPG_PASSPHRASE -e GPG_KEY_ID \
              cpz-arch-builder ./tools/ui-repo.sh
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site with the repositories
        uses: actions/upload-pages-artifact@v3
        with:
          path: master/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
