name: Build and publish CPZ image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true
      release_channel:
        description: "Channel override (auto derives it from the tag)"
        type: choice
        options: [auto, Stable, Beta]
        default: auto

permissions:
  contents: write
  actions: read

concurrency:
  group: cpz-image-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMG_BASENAME: cardputerzero-trixie-arm64

jobs:
  build-image:
    name: Build and publish ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
          CHANNEL: ${{ inputs.release_channel || 'auto' }}
        run: |
          set -euo pipefail
          # Manual runs may check out a tag by name without creating a local
          # ref; the os-list step needs it for `git log $TAG`.
          git fetch --quiet --tags --force origin
          TAG="$REQUESTED_TAG"
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "Tag must start with v: $TAG" >&2; exit 1 ;;
          esac

          VERSION="${TAG#v}"
          if ! printf '%s\n' "$VERSION" |
              grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag is not SemVer: $TAG (expected vX.Y.Z[-prerelease])" >&2
            exit 1
          fi

          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$FILE_VERSION" != "$VERSION" ]; then
            echo "VERSION ($FILE_VERSION) does not match tag ($TAG)" >&2
            exit 1
          fi

          case "$CHANNEL" in
            Stable) PRERELEASE=false ;;
            Beta) PRERELEASE=true ;;
            *)
              case "$TAG" in
                *-*) PRERELEASE=true ;;
                *) PRERELEASE=false ;;
              esac
              ;;
          esac

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "image=${IMG_BASENAME}-${TAG}.img.xz" >> "$GITHUB_OUTPUT"
          echo "Building $TAG (version $VERSION, prerelease=$PRERELEASE)"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y coreutils quilt parted debootstrap zerofree zip \
            dosfstools libarchive-tools libcap2-bin grep rsync xz-utils file git curl bc \
            gpg pigz xxd arch-test qemu-user-static kmod binfmt-support e2fsprogs

      - name: Configure build
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          cat > config <<CONFIG
          IMG_NAME=${IMG_BASENAME}
          IMG_FILENAME=${IMG_BASENAME}-${TAG}
          ARCHIVE_FILENAME=${IMG_BASENAME}-${TAG}
          RELEASE=trixie
          DEPLOY_COMPRESSION=xz
          TARGET_HOSTNAME=cardputerzero
          FIRST_USER_NAME=pi
          FIRST_USER_PASS=raspberry
          ENABLE_SSH=0
          LOCALE_DEFAULT=en_US.UTF-8
          KEYBOARD_KEYMAP=us
          KEYBOARD_LAYOUT="English (US)"
          TIMEZONE_DEFAULT=Asia/Shanghai
          PASSWORDLESS_SUDO=0
          CONFIG
          cat config

      - name: Verify CPZ stage structure
        run: ./tools/verify-stage.sh

      - name: Build image
        run: sudo XZ_DEFAULTS="-T0" ./build.sh

      - name: Fix deploy permissions
        run: sudo chown -R "$(id -u):$(id -g)" deploy/

      - name: Find output image
        id: image
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          FILE="deploy/${IMG_BASENAME}-${TAG}.img.xz"
          if [ ! -s "$FILE" ]; then
            echo "Expected $FILE is missing. deploy/ contains:" >&2
            find deploy/ -type f | sort >&2
            exit 1
          fi
          IMG_RAW="${FILE%.xz}"
          xz -dk "$FILE"
          INFO_FILE="${IMG_RAW%.img}.info"
          if [ ! -f "$INFO_FILE" ]; then
            echo "Image metadata file not found: $INFO_FILE" >&2
            exit 1
          fi
          ls -lh "$FILE" "$INFO_FILE"
          {
            echo "path=$FILE"
            echo "raw=$IMG_RAW"
            echo "info=$INFO_FILE"
            echo "name=$(basename "$FILE")"
          } >> "$GITHUB_OUTPUT"

      - name: Verify image contents
        env:
          RAW: ${{ steps.image.outputs.raw }}
        run: |
          set -o pipefail
          sudo apt-get install -y e2fsprogs
          sudo ./tools/verify-image.sh "$RAW" 2>&1 | tee deploy/full-image-verification.log

      - name: Collect component versions
        id: components
        env:
          INFO_FILE: ${{ steps.image.outputs.info }}
        run: |
          set -euo pipefail
          VERIFY_LOG="deploy/full-image-verification.log"

          KERNEL_VER=$(awk '$2 == "linux-image-rpi-v8" { print $3; exit }' "$INFO_FILE")
          [ -n "$KERNEL_VER" ] || { echo "Kernel version missing from image metadata"; exit 1; }

          DRIVER_COMMIT=$(awk '
            /dtoverlays source commit recorded \(/ {
              value = $0
              sub(/^.*recorded \(/, "", value)
              sub(/\).*$/, "", value)
              print value
              exit
            }
          ' "$VERIFY_LOG")
          [[ "$DRIVER_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Driver overlay commit missing or invalid"
            exit 1
          }

          echo "kernel_version=$KERNEL_VER" >> "$GITHUB_OUTPUT"
          echo "driver_commit=$DRIVER_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Components: kernel=$KERNEL_VER driver=$DRIVER_COMMIT"

      - name: Write release metadata
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          OSS_NAME: ${{ steps.meta.outputs.image }}
          KERNEL_VER: ${{ steps.components.outputs.kernel_version }}
          DRIVER_COMMIT: ${{ steps.components.outputs.driver_commit }}
        run: |
          set -euo pipefail
          DRIVER_SHORT="${DRIVER_COMMIT:0:7}"
          OSS_URL="https://cardputer-zero-repo.oss-cn-shenzhen.aliyuncs.com/${OSS_NAME}"

          cat > build-info.json <<INFO
          {
            "version": "${VERSION}",
            "tag": "${TAG}",
            "pigen_commit": "${GITHUB_SHA}",
            "ui": "terminal-first",
            "kernel_version": "${KERNEL_VER}",
            "driver_commit": "${DRIVER_COMMIT}",
            "config_cardputero_v0_5": true
          }
          INFO

          {
            echo "## CardputerZero CPZ ${TAG}"
            echo ""
            echo "Terminal-first Linux console + tmux image for CardputerZero."
            echo ""
            echo "- **Version:** ${VERSION}"
            echo "- **Kernel:** ${KERNEL_VER}"
            echo "- **Driver overlay:** m5stack/m5stack-linux-dtoverlays @ ${DRIVER_SHORT}"
            echo "- **pi-gen commit:** ${GITHUB_SHA}"
            echo "- **CONFIG_CARDPUTERO_V0_5:** y"
            echo ""
            echo "**OSS download:** [${OSS_NAME}](${OSS_URL})"
            if [ "$PRERELEASE" != "true" ]; then
              echo ""
              echo "**Stable alias:** [${IMG_BASENAME}-stable.img.xz](https://cardputer-zero-repo.oss-cn-shenzhen.aliyuncs.com/${IMG_BASENAME}-stable.img.xz)"
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          FILE: ${{ steps.image.outputs.path }}
          INFO_FILE: ${{ steps.image.outputs.info }}
          RAW: ${{ steps.image.outputs.raw }}
        run: |
          set -euo pipefail
          BASE="${RAW%.img}"
          ASSETS=("$FILE" "$INFO_FILE" build-info.json)
          for extra in "${BASE}.sbom" "${BASE}.sbom.xz" "${BASE}.bmap"; do
            [ -f "$extra" ] && ASSETS+=("$extra")
          done

          if [ "$PRERELEASE" = "true" ]; then
            FLAGS=(--prerelease)
          else
            FLAGS=(--latest)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              "${FLAGS[@]}"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" \
              --notes-file release-notes.md \
              "${FLAGS[@]}"
          fi

      - name: Upload to Aliyun OSS
        uses: manyuanrong/setup-ossutil@v3.0
        with:
          endpoint: oss-cn-shenzhen.aliyuncs.com
          access-key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

      - name: Copy image to OSS
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          FILE: ${{ steps.image.outputs.path }}
          OSS_NAME: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          ossutil cp -f "$FILE" "oss://cardputer-zero-repo/${OSS_NAME}"
          if [ "$PRERELEASE" != "true" ]; then
            ossutil cp -f "$FILE" \
              "oss://cardputer-zero-repo/${IMG_BASENAME}-stable.img.xz"
          fi

      - name: Update os-list.json
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          FILE: ${{ steps.image.outputs.path }}
          RAW: ${{ steps.image.outputs.raw }}
          OSS_NAME: ${{ steps.meta.outputs.image }}
          KERNEL_VER: ${{ steps.components.outputs.kernel_version }}
          DRIVER_COMMIT: ${{ steps.components.outputs.driver_commit }}
        run: |
          set -euo pipefail
          if ! ossutil cp "oss://cardputer-zero-repo/os-list.json" os-list.json; then
            printf '{"os_list": []}\n' > os-list.json
          fi

          RELEASE_DATE=$(git log -1 --format=%cs "$TAG")
          DOWNLOAD_SIZE=$(stat --format=%s "$FILE")
          DOWNLOAD_SHA=$(sha256sum "$FILE" | awk '{print $1}')
          EXTRACT_SIZE=$(stat --format=%s "$RAW")
          EXTRACT_SHA=$(sha256sum "$RAW" | awk '{print $1}')

          python3 scripts/update_os_list.py \
            --json os-list.json \
            --tag "$TAG" \
            --release-date "$RELEASE_DATE" \
            --is-prerelease "$PRERELEASE" \
            --release-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            --oss-filename "$OSS_NAME" \
            --download-size "$DOWNLOAD_SIZE" \
            --download-sha256 "$DOWNLOAD_SHA" \
            --extract-size "$EXTRACT_SIZE" \
            --extract-sha256 "$EXTRACT_SHA" \
            --kernel-version "$KERNEL_VER" \
            --driver-commit "$DRIVER_COMMIT" \
            --pigen-commit "$GITHUB_SHA"

          ossutil cp -f os-list.json "oss://cardputer-zero-repo/os-list.json"

      - name: Summary
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          OSS_NAME: ${{ steps.meta.outputs.image }}
          FILE: ${{ steps.image.outputs.path }}
        run: |
          {
            echo "## Published ${TAG}"
            echo ""
            echo "- Version: ${VERSION}"
            echo "- Prerelease: ${PRERELEASE}"
            echo "- Asset: ${OSS_NAME}"
            echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo ""
            echo '```'
            ls -lh "$FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
