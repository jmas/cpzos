name: Verify base image

on:
  push:
    branches: ["ui/qualities"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify the base image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker
        run: docker version

      - name: Build and verify
        run: make verify

  verify-ui:
    name: Build and verify the UI test image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    needs: verify
    # The UI image installs the signed apps repository and bakes its catalog.
    # Set the repository variable after the first apps-stable release.
    if: vars.CPZ_APPS_REPO != ''
    env:
      UI_APPS_REPO_STABLE: ${{ vars.CPZ_APPS_REPO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify the UI image
        run: make verify UI_TEST=1
