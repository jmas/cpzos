# The onboard ES8389 codec is the only speaker output. The vc4 HDMI card is
# card 0 and has no sink on the panel, so the ALSA default must point at the
# codec by name. Applications that want HDMI audio select it explicitly.
pcm.!default {
    type plug
    slave.pcm "hw:CARD=ES8389Audio,DEV=0"
}
ctl.!default {
    type hw
    card ES8389Audio
}
