# Single-session kiosk: no tmux prefix, no session UI. Windows are tabs and
# are controlled by the direct Alt bindings at the bottom of this file.
unbind -n C-b

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g escape-time 0
set -g focus-events on
set -g history-limit 5000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g exit-empty off
set -g mouse off
set -g automatic-rename off
set -g allow-rename off

set -g status-interval 0
set -g status-justify left
set -g status-left-length 20
set -g status-right-length 50
set -g status-left "#[bold]CPZ#[default] "
set -g status-right ""
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[reverse] #I:#W #[default] "
set -g message-style "fg=black,bg=yellow"

bind -n M-o display-popup -E -w 90% -h 80% /usr/lib/cpz/launcher
bind -n M-t new-window
bind -n M-w kill-window
bind -n M-Left previous-window
bind -n M-Right next-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
