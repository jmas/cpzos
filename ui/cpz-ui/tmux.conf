# Single-session kiosk: one tmux session, no session UI.
#
# Daily actions are direct Alt+key bindings. C-a remains as an advanced tmux
# prefix fallback (C-b is unbound), but session commands are unbound: no
# session chooser, rename, switching or creation from the keyboard UI.

set -g prefix C-a
unbind C-b
bind C-a send-prefix

unbind s
unbind '$'
unbind '('
unbind ')'

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g escape-time 0
set -g focus-events on
set -g history-limit 5000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g exit-empty off
set -g mouse off
# A new tab starts Apps Home; choosing an app replaces the window. The apps
# package is a dependency of cpz-ui, so the command always exists.
set -g default-command /usr/bin/cpz-app home
set -g automatic-rename off
set -g allow-rename off
set -g set-clipboard on
set -as terminal-features "foot:clipboard"
set -g mode-keys vi

# --- status bar -----------------------------------------------------------
# The active tab is a light block on the dark status row. The left side is
# empty so the tabs start at the edge; the status helper owns the right side.
set -g status on
set -g status-position bottom
set -g status-interval 0
set -g status-justify left
set -g status-left-length 0
set -g status-right-length 50
set -g status-style "bg=#1b1b1b,fg=#cfcfcf"
set -g status-left ""
set -g status-right ""

set -g window-status-separator ""
set -g window-status-style "fg=#8a8a8a,bg=#1b1b1b"
set -g window-status-current-style "fg=#101010,bg=#d7d7d7,bold"
set -g window-status-activity-style "fg=#e5e500,bg=#1b1b1b,bold"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "

# --- direct Alt actions ---------------------------------------------------
# The main branch keeps every daily action to Alt+one key. Tab cycling uses
# Alt+Tab / Alt+Shift+Tab instead of Alt+arrows, which are Fn chords on the
# internal keyboard.
bind -n M-o display-popup -E -w 90% -h 80% /usr/bin/cpz-app apps
bind -n M-h display-popup -E -w 90% -h 90% /usr/lib/cpz/help
bind -n M-t new-window
bind -n M-w kill-window
bind -n M-Tab next-window
bind -n M-BTab previous-window
bind -n M-r command-prompt -p "Rename tab:" "rename-window -- '%%'"
bind -n M-l choose-tree -Zw

bind -n M-v split-window -h
bind -n M-b split-window -v
bind -n M-n select-pane -t :.+
bind -n M-p select-pane -t :.-
bind -n M-z resize-pane -Z
bind -n M-x kill-pane

bind -n M-c copy-mode
bind -n M-y paste-buffer -p

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
